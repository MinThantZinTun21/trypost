# TryPost — on the Owner's Vultr server, next to Chord Book (ADR 0005, ADR 0006).
#
# Lives in /opt/trypost next to a .env holding the production settings
# (APP_KEY, DB_URL for Supabase, R2_*, the platform OAuth keys) plus
# APP_DOMAIN, the domain the Deploy workflow checks over HTTPS.
#
# The Deploy workflow (.github/workflows/deploy.yml) loads the image and runs:
#   docker compose -f compose.vultr.yaml up -d
#
# Chord Book's Caddy owns ports 80 and 443 and serves APP_DOMAIN (its
# TRYPOST_SITE) by forwarding to `trypost:80` on the shared `edge` network,
# which Chord Book's stack creates. The app publishes no port: only that
# Caddy reaches it, which is what makes trusting every proxy
# (bootstrap/app.php) safe. Postgres is Supabase and media is R2.

services:
  app:
    # Loaded by the Deploy workflow; the server never builds or pulls it.
    image: trypost-app:latest
    pull_policy: never
    container_name: trypost
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      TRYPOST_TARGET: production
    expose:
      - "80"
    networks:
      edge:
        aliases:
          - trypost
    volumes:
      - storage:/var/www/html/storage/app
    # The server has 1 GB shared with Chord Book (and 2 GB of swap).
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

networks:
  edge:
    external: true

volumes:
  storage:
