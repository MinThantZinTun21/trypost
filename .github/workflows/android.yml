name: Android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    name: Unit tests and debug build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew --console=plain :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew --console=plain :app:lintDebug

      - name: Debug build
        run: ./gradlew --console=plain :app:assembleDebug

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-reports
          path: |
            android/app/build/reports
            android/app/build/test-results
          if-no-files-found: ignore
