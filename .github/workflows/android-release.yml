name: Android release

# Builds the signed release APK for the Owner to download and install
# (ADR 0010). Manual only; the keystore lives in the repository's secrets.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Signed release APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew --console=plain :app:testDebugUnitTest

      - name: Build and sign the release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          TRYPOST_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TRYPOST_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TRYPOST_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TRYPOST_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Set the ANDROID_KEYSTORE_BASE64 secret first (see the README's Android app section)."
            exit 1
          fi

          export TRYPOST_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$TRYPOST_KEYSTORE_FILE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$TRYPOST_KEYSTORE_FILE"

          ./gradlew --console=plain :app:assembleRelease

          apk=app/build/outputs/apk/release/app-release.apk
          PATH="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1):$PATH"
          apksigner verify --print-certs "$apk" | grep -v 'SHA-1'

      - uses: actions/upload-artifact@v7
        with:
          name: trypost-android-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
